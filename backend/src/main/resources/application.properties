# SPRING - APPLICATION
spring.application.name=backend

# SPRING - DATASOURCE
spring.datasource.url=${SUPABASE_URL}
spring.datasource.username=${SUPABASE_USERNAME}
spring.datasource.password=${SUPABASE_PASSWORD}

spring.datasource.hikari.initializationFailTimeout=60000
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.connection-init-sql=SET hnsw.ef_search = 100

# SPRING - JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

#SPRING - SERVLET
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB

# SERVER
server.address=0.0.0.0
server.port=${PORT:8080}

# ACTUATOR
management.endpoints.web.exposure.include=mappings

# JWT
jwt.signer-key=${JWT_SIGNER_KEY}

# MEZON
mezon.client-id=${MEZON_CLIENT_ID}
mezon.client-secret=${MEZON_CLIENT_SECRET}
mezon.redirect-uri=${MEZON_REDIRECT_URI}

mezon.auth-url=${MEZON_AUTH_URL}
mezon.token-url=${MEZON_TOKEN_URL}
mezon.user-info-url=${MEZON_USER_INFO_URL}

# GOOGLE
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI}

google.auth-url=${GOOGLE_AUTH_URL}
google.token-url=${GOOGLE_TOKEN_URL}
google.user-info-url=${GOOGLE_USER_INFO_URL}

# GEMINI
gemini.api-key=${GEMINI_API_KEY}
gemini.embedding-url=${GEMINI_EMBEDDING_URL}
gemini.batch-embedding-url=${GEMINI_BATCH_EMBEDDING_URL}

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

#MAIL (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# FORGOT PASSWORD
forgot-password.otp-length=6
forgot-password.otp-expiry-minutes=10
forgot-password.max-attempts=5
forgot-password.resend-cooldown-seconds=60

