<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Upload nhiều tài liệu</title>
</head>
<body>
<div>
    <div>
        <p>
            http://localhost:8080/
            <input
                    id="endpointInput"
                    placeholder="endpoint"
                    value="api/classes/2/directories/19/documents"
            >
        </p>
    </div>

    <div>
        <label for="fileInput">Files:</label>
        <input
                type="file"
                id="fileInput"
                multiple
        >

        <label for="tokenInput">Bearer Token:</label>
        <input
                id="tokenInput"
                placeholder="Nhập access token"
        >
    </div>

    <button onclick="uploadFiles()">Upload</button>

    <div id="result"></div>
</div>

<script>
    async function uploadFiles() {
        const endpointInput = document.getElementById("endpointInput");
        const fileInput = document.getElementById("fileInput");
        const tokenInput = document.getElementById("tokenInput");
        const result = document.getElementById("result");

        const files = fileInput.files;

        if (files.length === 0) {
            result.innerText = "Vui lòng chọn ít nhất một file";
            return;
        }

        const token = tokenInput.value.trim();
        const formData = new FormData();

        // Thêm tất cả file vào cùng một request
        for (const file of files) {
            formData.append("files", file);
        }

        const request = {
            title: "Tài liệu Java",
            description: "Tài liệu học tập"
        };

        formData.append(
            "request",
            new Blob(
                [JSON.stringify(request)],
                { type: "application/json" }
            )
        );

        try {
            const endpoint = endpointInput.value
                .trim()
                .replace(/^\/+/, "");

            const headers = {};

            if (token) {
                headers["Authorization"] = `Bearer ${token}`;
            }

            result.innerText = `Đang upload ${files.length} file...`;

            const response = await fetch(
                "http://localhost:8080/" + endpoint,
                {
                    method: "POST",
                    headers,
                    body: formData
                }
            );

            const data = await response.text();

            if (!response.ok) {
                console.error(data);
                result.innerText = `Upload thất bại (${response.status}): ${data}`;
                return;
            }

            result.innerText = data;

        } catch (error) {
            console.error(error);
            result.innerText = "Không thể kết nối đến server";
        }
    }
</script>
</body>
</html>
